# fly.toml — one app serves everything (ADR 0009).
# First deploy: fly launch --copy-config --no-deploy, attach Postgres so
# DATABASE_URL is set as a secret, then fly deploy.
app = "lore"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
