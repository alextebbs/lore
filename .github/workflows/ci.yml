name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lore
          POSTGRES_PASSWORD: lore
          POSTGRES_DB: lore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lore"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend typecheck and build
        run: |
          cd web
          npm ci
          npm run typecheck
          npm run build

      - name: Go vet and test
        run: |
          go vet ./...
          go test ./...

      - name: sqlc generate is committed
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
          git diff --exit-code

      - name: Boot smoke test (migrations + health)
        env:
          DATABASE_URL: postgres://lore:lore@localhost:5432/lore
          PORT: 8080
        run: |
          go build -o bin/lore ./cmd/lore
          ./bin/lore &
          for i in $(seq 1 20); do
            curl -sf localhost:8080/api/health && break || sleep 0.5
          done
          curl -sf localhost:8080/api/health | grep '"db":"ok"'

      - name: Playwright smoke suite
        env:
          DATABASE_URL: postgres://lore:lore@localhost:5432/lore
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run dev &
          for i in $(seq 1 30); do curl -sf localhost:5173 >/dev/null && break || sleep 0.5; done
          npx playwright test
